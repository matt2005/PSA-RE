id: 0x8FC
name: 'Mileage in odometer'
alt_names: ['RELECTURE_COMBINE']
length: 5
comment:
  en: 'Mileage stored in the odometer'
  fr: 'Mileage stored in the odometer'
observations: 
  en: 'The BSI reads this data from the CMB at startup.'
  fr: ''
type: 'VAN'
method: 'in-frame reply'
periodicity: 'event based'
senders:
  - 'CMB'
receivers:
  - 'BSI'

signals:
  HEADER:
    bits: '1'
    alt_names: ['MARQ_DEB']
    comment:
      en: 'Header'
      fr: 'MARQ_DEB'
    type: 'uint8_t'
    min: 0x80
    max: 0x89

  REAR_RIGHT_WHEEL_SPEED:
    bits: '2-4'
    alt_names: ['KM_SAUV']
    comment:
      en: 'Mileage saved (saved at least every 10 kms)'
      fr: 'Kilométrage sauvegardé (Le kilométrage est sauvegardé au moins tous les 10 km.)'
    
    type: 'uint32_t'
    offset: 0
    min: 0
    max: 0xFFFFE
    factor: 0.1
    unit: 'km/h'

  FOOTER:
    bits: '5'
    alt_names: ['MARQ_FIN']
    comment:
      en: 'Footer'
      fr: 'Marquée fin'
    type: 'uint8_t'
    min: 0x80
    max: 0x89
