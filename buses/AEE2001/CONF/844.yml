id: 0x844
name: 'TLM3 command'
alt_names: ['COMMANDE TLM3']
length: 9
comment:
  en: 'TLM3 command'
  fr: 'COMMANDE TLM3'
type: 'VAN'
method: 'write (require ack)'
periodicity: '200ms'
senders:
  - 'BSI'
receivers:
  - 'RT3'

signals:
  MAINTENANCE_STATUS:
    bits: '1.7'
    alt_names: ['SIGN_KMAINT']
    comment:
      en: 'Mileage maintenance status'
      fr: 'Signe du kilométrage avant maintenance'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Outdated maintenance'
        fr: 'Maintenance dépassée'

  MILEAGE_BEFORE_MAINTENANCE:
    bits: '1.6-2.0'
    alt_names: ['KMAINT']
    comment:
      en: 'Mileage before maintenance'
      fr: 'Kilométrage avant maintenance'
    type: 'uint16_t'
    offset: 0
    min: 0
    max: 140000
    invalid: 0x7FFF
    factor: 20
    unit: 'km'

  ENGINE_OIL_TEMPERATURE:
    bits: '3'
    alt_names: ['T_HUILE']
    comment:
      en: 'Engine oil temperature'
      fr: 'Température d`huile moteur'
    type: 'uint8_t'
    offset: -40
    min: -40
    max: 214
    invalid: 0xFF
    factor: 1
    unit: 'celsius'

  FILTERED_FUEL_LEVEL:
    bits: '4'
    alt_names: ['NIV_CRB']
    comment:
      en: 'Filtered fuel level'
      fr: 'Niveau de carburant filtré'
    type: 'uint8_t'
    offset: 0
    min: 0
    max: 100
    invalid: 0xFF
    factor: 1
    unit: '%'

  ENGINE_OIL_LEVEL:
    bits: '5'
    alt_names: ['NIV_HUILE']
    comment:
      en: 'Engine oil level'
      fr: 'Niveau d`huile moteur'
    type: 'uint8_t'
    offset: 0
    min: 0
    max: 250
    invalid: 0xFF
    factor: 1
    unit: '%'

  LPG_FUEL_LEVEL:
    bits: '6'
    alt_names: ['NIV_GPL']
    comment:
      en: 'Engine oil level'
      fr: 'Niveau d`huile moteur'
    type: 'uint8_t'
    offset: 0
    min: 0
    max: 100
    invalid: 0xFF
    factor: 1
    unit: '%'

  LEFT_BUTTON_STATUS:
    bits: '7.7'
    alt_names: ['PSH_GH_CMD_TLM3']
    comment:
      en: 'Left button active'
      fr: 'Activation Push gauche'
    values:
      0:
        en: 'Inactive'
        fr: 'Commande non activée'
      1:
        en: 'Active'
        fr: 'Commande activée'

  RIGHT_BUTTON_STATUS:
    bits: '7.6'
    alt_names: ['PSH_DT_CMD_TLM3']
    comment:
      en: 'Right button active'
      fr: 'Activation Push droit'
    values:
      0:
        en: 'Inactive'
        fr: 'Commande non activée'
      1:
        en: 'Active'
        fr: 'Commande activée'

  UNUSED_1:
    bits: '7.5-7.0'
    alt_names: ['Libre6']
    unused: true

  UNUSED_2:
    bits: '8.7-9.0'
    alt_names: ['Reserve_16']
    unused: true
    comment:
      en: 'The last two bytes of this frame are reserved, knowing that it is a frame used for remote diagnosis.'
      fr: 'Les deux derniers octets de cette trame sont réservés, sachant qu`il s`agit d`une trame utilisée pour des services de télédiagnostic.'
