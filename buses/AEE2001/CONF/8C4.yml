id: 0x8C4
name: 'BSI events'
alt_names: ['EVENEMENT_BSI']
length: 2
comment:
  en: 'EMF BSI requests'
  fr: 'DEMANDES EMF BSI'
observations: 
  en: 'The BSI sends this frame to the EMF/RT3 which on reception will transmit a read message according to the event type. For example on the trip button push event the EMF sends an 0x564 message to read the current status of the trip data. Or when a radio button pressed the EMF sends a 0x4D4 to read the status of the radio'
  fr: ''
type: 'VAN'
method: 'write (require ack)'
periodicity: 'event based'
senders:
  - 'BSI'
receivers:
  - 'EMF'
  - 'RT3'

signals:
  MAIN_EVENT_STATUS:
    bits: '1.7'
    alt_names: ['PRN_EVENT']
    comment:
      en: 'Main event (generic)'
      fr: 'Evénement principal (Générique)'
    values:
      0:
        en: 'Not present'
        fr: 'Non Présent'
      1:
        en: 'Present'
        fr: 'Présent'

  SECONDARY_EVENT_STATUS:
    bits: '1.6'
    alt_names: ['SEC_EVENT']
    comment:
      en: 'Secondary event (generic)'
      fr: 'Evénément secondaire présent (Générique)'
    values:
      0:
        en: 'Not present'
        fr: 'Non Présent'
      1:
        en: 'Present'
        fr: 'Présent'

  UNUSED_1:
    bits: '1.5'
    alt_names: ['Libre1']
    unused: true

  EVENT_SOURCE:
    bits: '1.4-1.0'
    alt_names: ['SRC_EVENT']
    comment:
      en: 'Source of event (generic)'
      fr: 'Source des événements (générique)'
    values:
      0x0E:
        en: 'Climatisation'
        fr: 'Climatisation'
      0x12:
        en: 'BSI'
        fr: 'BSI'
      0x0A:
        en: 'Radio'
        fr: 'Auto Radio'
      0x07:
        en: 'Navigation'
        fr: 'Navigation'
      0x1A:
        en: 'Phone'
        fr: 'Radio téléphone'
      0x16:
        en: 'CD changer'
        fr: 'Lecteur multidisques compacts'
      0x14:
        en: 'Parking assistance'
        fr: 'Aide Au Stationnement'

  ALERT_CHANGE_STATUS:
    bits: '2.7'
    alt_names: ['CHG_DEF_EVE_BSI']
    comment:
      en: 'Changing the alerts and faults to display'
      fr: 'Changement des alertes et des défauts à afficher'
    values:
      0:
        en: 'Not changing'
        fr: 'Pas de changement'
      1:
        en: 'Changing'
        fr: 'Changement'

  SIGNAL_AND_MODE_CHANGE_STATUS:
    bits: '2.6'
    alt_names: ['CHG_SIG_EVE_BSI']
    comment:
      en: 'Changing signals and modes'
      fr: 'Changement des signalisations et modes'
    values:
      0:
        en: 'Not changing'
        fr: 'Pas de changement'
      1:
        en: 'Changing'
        fr: 'Changement'

  DOOR_CHANGE_STATUS:
    bits: '2.5'
    alt_names: ['CHG_OUV_EVE_BSI']
    comment:
      en: 'Door status change'
      fr: 'Changement d`état des ouvrants'
    values:
      0:
        en: 'Not changing'
        fr: 'Pas de changement'
      1:
        en: 'Changing'
        fr: 'Changement'

  UNUSED_2:
    bits: '2.4'
    alt_names: ['Libre1']
    unused: true

  TRIP_BUTTON_CHANGE_STATUS:
    bits: '2.3'
    alt_names: ['CHG_ODB_EVE_BSI']
    comment:
      en: 'Trip computer change button pushed'
      fr: 'Changement d`une donnée ODB'
    values:
      0:
        en: 'Not changing'
        fr: 'Pas de changement'
      1:
        en: 'Changing'
        fr: 'Changement'

  UNUSED_3:
    bits: '2.2'
    alt_names: ['Libre3']
    unused: true

  PARKING_AID_DISPLAY_REQUEST:
    bits: '2.1'
    alt_names: ['DEMD_AFFI_AAS']
    comment:
      en: 'AAS display request'
      fr: 'Demande d`affichage AAS'
    values:
      0:
        en: 'Not requested'
        fr: 'Pas de demande d`affichage'
      1:
        en: 'Requested'
        fr: 'Demande d`affichage'


  PARKING_AID_BEEP_REQUEST:
    bits: '2.0'
    alt_names: ['DEMD_BEEP_AAS']
    comment:
      en: 'Request to issue an AAS beep'
      fr: 'Demande d`émission d`un beep AAS'
    values:
      0:
        en: 'Not requested'
        fr: 'Pas de demande d`émission d`un beep'
      1:
        en: 'Requested'
        fr: 'Demande d`émission d`un beep'
