id: 0x4DC
name: 'A/C INFORMATION'
alt_names: ['INFOS_CLIMATISATION']
length: 7
comment:
  en: ''
  fr: ''
type: 'VAN'
method: 'write (require ack)'
periodicity: '200ms + event based'
senders:
  - 'BSI'
receivers:
  - 'CLIM'

signals:
  AIR_CONDITIONER_STATUS:
    bits: '1.7'
    alt_names: ['ETAT_ACT_INF_CLIM']
    comment:
      en: 'Air conditioning operating status'
      fr: 'Etat fonctionnement climatisation'
    values:
      0:
        en: 'Inactive'
        fr: 'Non activé'
      1:
        en: 'Active'
        fr: 'Activé'
    receivers:

  AC_ENABLED_STATUS:
    bits: '1.6'
    alt_names: ['ETAT_CMPR_INF_CLIM']
    comment:
      en: 'Authorization of the A/C compressor'
      fr: 'Autorisation du compresseur AC/OUT'
    values:
      0:
        en: 'Not authorized'
        fr: 'Non autorisé'
      1:
        en: 'Authorized'
        fr: 'Autorisé'

  REAR_WINDOW_HEATING_STATUS:
    bits: '1.5'
    alt_names: ['ETAT_LUNCH_INF_CLIM']
    comment:
      en: 'Rear window heating status'
      fr: 'Etat fonctionnement Lunch'
    values:
      0:
        en: 'Inactive'
        fr: 'Non activé'
      1:
        en: 'Active'
        fr: 'Activé'

  LOAD_SCHEDDING_LEVEL1_STATUS:
    bits: '1.4'
    alt_names: ['DEL_NV1_INF_CLIM']
    comment:
      en: 'Level 1 load shedding requested'
      fr: 'Délestage niveau 1 demandé'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  LOAD_SCHEDDING_LEVEL2_STATUS:
    bits: '1.3'
    alt_names: ['DEL_NV2_INF_CLIM']
    comment:
      en: 'Level 2 load shedding requested'
      fr: 'Délestage niveau 2 demandé'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  LOAD_SCHEDDING_LEVEL3_STATUS:
    bits: '1.2'
    alt_names: ['DEL_NV3_INF_CLIM']
    comment:
      en: 'Level 3 load shedding requested'
      fr: 'Délestage niveau 3 demandé'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  HEATING_MATRIX_STATUS:
    bits: '1.1'
    alt_names: ['BRUL_ETAT_INF_CLIM']
    comment:
      en: 'Additional heating matrix info (HDi models had this)'
      fr: 'Etat du brûleur additionnel'
    values:
      0:
        en: 'Not triggered'
        fr: 'Non enclenché'
      1:
        en: 'Triggered'
        fr: 'Enclenché'

  COMPRESSOR_STATUS:
    bits: '1.0'
    alt_names: ['CMPR_ETAT_INF_CLIM']
    comment:
      en: 'Compressor status'
      fr: 'Etat du compresseur'
    values:
      0:
        en: 'Not triggered'
        fr: 'Non enclenché'
      1:
        en: 'Triggered'
        fr: 'Enclenché'

  HEATING_STATUS:
    bits: '2.7-2.5'
    alt_names: ['CHAUF_ETAT_INF_CLIM']
    comment:
      en: 'Additional heating status'
      fr: 'Etat du chauffage additionel'
    values:
      000:
        en: 'No heating'
        fr: 'Pas de chauffage'
      001:
        en: 'Output 1 active'
        fr: 'Sortie 1 active'
      010:
        en: 'Output 2 active'
        fr: 'Sortie 2 active'
      011:
        en: 'Output 1 and 2 active'
        fr: 'Sortie 1 et 2 actives'

  AC_MANAGEMENT_STATUS:
    bits: '2.4-2.3'
    alt_names: ['ETAT_GES_INF_CLIM']
    comment:
      en: 'AC management status'
      fr: 'Etat gestion climatisation'
    values:
      0x00:
        en: 'OK'
        fr: 'OK'
      0x01:
        en: 'Low safety active'
        fr: 'Securité basse active'
      0x10:
        en: 'High safety active'
        fr: 'Securité haute active'
      0x11:
        en: 'Invalid'
        fr: 'Invalide'

  SAFETY_STATUS:
    bits: '2.2'
    alt_names: ['SECURITE_INF_CLIM']
    comment:
      en: 'Presence of pressure switch, temperature sensor or evaporator temp.'
      fr: 'Sécurité pression ou T d`eau ou T évaporateur'
    values:
      0:
        en: 'Absent'
        fr: 'Absente'
      1:
        en: 'Presente'
        fr: 'Présente'

  RETRACTABLE_ROOF_STATUS:
    bits: '2.1'
    alt_names: ['ETAT_TE_INF_CLIM']
    comment:
      en: 'Retractable roof open status to neutralize the consideration of the passenger compartment sensor, which would be disturbed by the air flow otherwise'
      fr: 'Condition "Etat toit Escamotable ouvert" pour neutraliser la prise en compte de la sonde habitacle, qui serait perturbée par le flux d`air sinon'
    values:
      0:
        en: 'Closed'
        fr: 'Tout escamotable fermé'
      1:
        en: 'Tout escamotable ouvert'
        fr: 'Open'

  START_AND_STOP_ENGINE_STATUS:
    bits: '2.0'
    alt_names: ['STOP_GO_ETAT_CLIM']
    comment:
      en: 'Start&Stop Engine status'
      fr: 'Etat moteur en Stop and Go'
    values:
      0:
        en: 'Inactive'
        fr: 'Non activé'
      1:
        en: 'Active'
        fr: 'Activé'

  PRESSURE_VALUE:
    bits: '3'
    alt_names: ['PRES_BC_CLIM']
    comment:
      en: 'Pressure value (N*25 - resolution 25 kPa)'
      fr: 'Pression boucle froide (N*25 - resolution 25 kPa)'
    type: 'uint'
    offset: 0
    min: 0
    max: 0xC8
    factor: 20
    invalid: 0xFF
    unit: 'kPa'

  EVAPORATOR_TEMPERATURE:
    bits: '4-5'
    alt_names: ['TEMP_EVA_CLIM']
    comment:
      en: 'Evaporator temperature (N/10-40 - resolution 0,1 °C)'
      fr: 'Température évaporateur (N/10-40 - resolution 0,1 °C)'
    type: 'uint'
    offset: -40
    factor: 0.1
    min: -40
    max: 0x04B0
    invalid: 0xFFFF
    units: 'celsius'

  AMBIENT_LUMINOSITY_VALUE1:
    bits: '6'
    alt_names: ['MES_LUM']
    comment:
      en: 'Measured luminosity (0%-100%, 0 Lux - 100 000 Lux)'
      fr: 'Mesure d`ensoleillement'
    offset: 0
    factor: 1
    min: 0
    max: 100
    invalid: 0xFF
    units: '%'

  AMBIENT_LUMINOSITY_VALUE2:
    bits: '7'
    alt_names: ['MES_LUM']
    comment:
      en: 'Measured luminosity (0%-100%, 0 Lux - 100 000 Lux)'
      fr: 'Mesure d`ensoleillement'
    offset: 0
    factor: 1
    min: 0
    max: 100
    invalid: 0xFF
    units: '%'
