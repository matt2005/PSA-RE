id: 0x524
name: 'Display data'
alt_names: ['AFFICHAGES_BSI']
length: 14
comment:
  en: 'MESSAGES FOR DISPLAY'
  fr: 'AFFICHAGES BSI'
type: 'VAN'
method: 'broadcast'
periodicity: '500 ms + event based'
senders:
  - 'BSI'
receivers:
  - 'EMF'
  - 'CMB'
  - 'BTO'

