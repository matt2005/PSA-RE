id: 0x9C4
name: 'Radio commands'
alt_names: ['COMMANDES_BSI']
length: 2
comment:
  en: 'Radio commands'
  fr: 'Commandes radio'
type: 'VAN'
periodicity: '500ms + event based'
method: 'write (require ack)'
senders:
  - 'BSI'
receivers:
  - 'EMF'
  - 'RT3'

signals:
  SEEK_UP:
    bits: '1.7'
    alt_names: ['SEEK_UP_CDE_RAD1']
    comment:
      en: 'Radio commands: seek up'
      fr: 'Commandes radio: recherche montante'
    values:
      0:
        en: 'Command inactive'
        fr: 'Commande non active'
      1:
        en: 'Command active'
        fr: 'Commande active'

  SEEK_DOWN:
    bits: '1.6'
    alt_names: ['SEEK_DWN_CDE_RAD1']
    comment:
      en: 'Radio commands: seek down'
      fr: 'Commandes radio: recherche descendante'
    values:
      0:
        en: 'Command inactive'
        fr: 'Commande non active'
      1:
        en: 'Command active'
        fr: 'Commande active'

  OVERFLOW_POSITIVE:
    bits: '1.5'
    alt_names: ['OVF_SCANUP_CDE_RAD1']
    comment:
      en: 'Radio commands: counter overflow info+'
      fr: 'Commandes radio: info débordement compteur+'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Overflow'
        fr: 'Débordement'

  OVERFLOW_NEGATIVE:
    bits: '1.4'
    alt_names: ['OVF_SCANDWN_CDE_RAD1']
    comment:
      en: 'Radio commands: counter overflow info-'
      fr: 'Commandes radio: info débordement compteur-'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Overflow'
        fr: 'Débordement'

  VOLUME_UP:
    bits: '1.3'
    alt_names: ['VOL_UP_CDE_RAD1']
    comment:
      en: 'Radio commands: volume+'
      fr: 'Commandes radio: volume+'
    values:
      0:
        en: 'Inactive'
        fr: 'Commande non active'
      1:
        en: 'Active'
        fr: 'Commande active'

  VOLUME_DOWN:
    bits: '1.2'
    alt_names: ['VOL_DWN_CDE_RAD1']
    comment:
      en: 'Radio commands: volume-'
      fr: 'Commandes radio: volume-'
    values:
      0:
        en: 'Inactive'
        fr: 'Commande non active'
      1:
        en: 'Active'
        fr: 'Commande active'

  MODE_TEL:
    bits: '1.1'
    alt_names: ['MODE_TEL_CDE_RAD1']
    comment:
      en: 'Radio commands: Model/telephone'
      fr: 'Commandes radio: Mode/téléphone'
    values:
      0:
        en: 'Inactive'
        fr: 'Commande non active'
      1:
        en: 'Active'
        fr: 'Commande active'

  UNUSED_1:
    bits: '1.0'
    alt_names: ['Libre1']
    unused: true

  SCROLL_POS:
    bits: '2'
    alt_names: ['CMPT_MOL_CDE_RAD2']
    comment:
      en: 'SCAN wheel counter (number of steps from 0 to 255). Initial value: 0x80. Overflow direction indicated by 1.5 and 1.4'
      fr: 'Commandes radio: compteur de la molette SCAN (nombre de pas de 0 á 255). Indique le nombre de pas de 0 á 255 de la molette'
    type: 'uint8_t'
    offset: 0
    min: 0
    max: 255
    factor: 1
    unit: 'counter'