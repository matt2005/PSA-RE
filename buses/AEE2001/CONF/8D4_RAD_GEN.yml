id: 0x8C4
name: 'General radio commands'
alt_names: ['COMMANDE_RADIO_GEN']
length: 2
comment:
  en: 'General radio commands'
  fr: 'DEMANDES EMF BSI'
observations: 
  en: ''
  fr: ''
type: 'VAN'
method: 'write (require ack)'
periodicity: 'event based'
senders:
  - 'EMF'
receivers:
  - 'RAD'

signals:
  COMMAND_ID:
    bits: '1.7-1.0'
    alt_names: ['IDENT_CMD_RAD']
    comment:
      en: 'Id of the command'
      fr: 'Identification du paramètre de la commande'
    values:
      0x11:
        en: 'GEN'
        fr: 'GEN'
      0x12:
        en: 'SRC'
        fr: 'SRC'
      0x13:
        en: 'VOL'
        fr: 'VOL'
      0x14:
        en: 'AUD'
        fr: 'AUD'
      0x21:
        en: 'TUNER_MEM'
        fr: 'TUNER_MEM'
      0x22:
        en: 'TUNER_TUN'
        fr: 'TUNER_TUN'
      0x23:
        en: 'TUNER_FRQ'
        fr: 'TUNER_FRQ'
      0x24:
        en: 'TUNER_RDS'
        fr: 'TUNER_RDS'
      0x25:
        en: 'TUNER_PI'
        fr: 'TUNER_PI'
      0x26:
        en: 'TUNER_PTY_SEL'
        fr: 'TUNER_PTY_SEL'
      0x27:
        en: 'TUNER_REPERTOIRE'
        fr: 'TUNER_REPERTOIRE'
      0x31:
        en: 'CASSETTE_TAP1'
        fr: 'CASSETTE_TAP1'
      0x32:
        en: 'CASSETTE_TAP2'
        fr: 'CASSETTE_TAP2'
      0x61:
        en: 'CD'
        fr: 'CD'
      0x81:
        en: 'AAS'
        fr: 'AAS'
      0xD1:
        en: 'ETAT_TUNER'
        fr: 'ETAT_TUNER'
      0xD2:
        en: 'ETAT_CASSETTE'
        fr: 'ETAT_CASSETTE'
      0xD3:
        en: 'ETAT_TUNER_REPERTOIRE'
        fr: 'ETAT_TUNER_REPERTOIRE'
      0xD4:
        en: 'ETAT_EG_DSP'
        fr: 'ETAT_EG_DSP'
      0xD5:
        en: 'ETAT_DCC_MD'
        fr: 'ETAT_DCC_MD'
      0xD6:
        en: 'ETAT_CD'
        fr: 'ETAT_CD'

  POWER_ON:
    bits: '2.7'
    alt_names: ['ON_GEN_CMD_RAD']
    comment:
      en: 'Car radio active or inactive (ON / OFF)'
      fr: 'Fonctionnement actif ou inactif(ON/OFF) auto-radio'
    values:
      0:
        en: 'OFF'
        fr: 'OFF'
      1:
        en: 'ON'
        fr: 'ON'

  ACTIVE_ON:
    bits: '2.6'
    alt_names: ['ACTIF_GEN_CMD_RAD']
    comment:
      en: 'Switching the car radio to active or inactive'
      fr: 'Passage à l´état actif ou inactif de l´auto-radio'
    values:
      0:
        en: 'Inactive'
        fr: 'Inactif'
      1:
        en: 'Active'
        fr: 'Actif'

  BUTTON_MODE:
    bits: '2.5'
    alt_names: ['CLAV_GEN_CMD_RAD']
    comment:
      en: 'Button mode'
      fr: 'Activation mode clavier'
    values:
      0:
        en: 'Normal mode'
        fr: 'Mode normal'
      1:
        en: 'Keypad mode'
        fr: 'Activer mode clavier'

  LOUDNESS_ON:
    bits: '2.4'
    alt_names: ['LOUD_GEN_CMD_RAD']
    comment:
      en: 'Activate loudness mode'
      fr: 'Activation du correcteur physiologique'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  GENERATE_BEEP:
    bits: '2.3-2.2'
    alt_names: ['BEEP_GEN_CMD_RAD']
    comment:
      en: 'Generate beep signal'
      fr: 'Génération d´un Beep'
    values:
      00:
        en: 'No beep'
        fr: 'Pas de beep'
      01:
        en: 'Acknowledge'
        fr: 'Acknowledge'
      10:
        en: 'Error'
        fr: 'Erreur'
      11:
        en: 'Alarm'
        fr: 'Alarme'

  AUTO_VOLUME_ON:
    bits: '2.1'
    alt_names: ['VOL_AUTO_GEN_CMD_RAD']
    comment:
      en: 'Automatic volume control on / off'
      fr: 'Asservissement automatique du volume activé / non activé'
    values:
      0:
        en: 'Inactive'
        fr: 'Inactif'
      1:
        en: 'Active'
        fr: 'Actif'

  MUTE:
    bits: '2.0'
    alt_names: ['MUTE_GEN_CMD_RAD']
    comment:
      en: 'Mute control on / off'
      fr: 'Commande de Mute activé / non activé'
    values:
      0:
        en: 'Inactive'
        fr: 'Inactif'
      1:
        en: 'Active'
        fr: 'Actif'
