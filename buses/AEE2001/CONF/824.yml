id: 0x824
name: 'FAST BSI DATA'
alt_names: ['DONNEES_BSI_RAPIDES']
length: 7
comment:
  en: 'FAST BSI DATA'
  fr: 'DONNEES_BSI_RAPIDES'
type: 'VAN'
periodicity: '50ms'
method: 'broadcast'
senders:
  - 'BSI'
receivers:
  - 'all'

signals:
  RPM:
    bits: '1-2'
    alt_names: ['VITM']
    comment:
      en: 'Engine speed (rpm)'
      fr: 'Régime moteur'
    type: 'uint16'
    offset: 0
    min: 0
    max: 0xFFFE
    invalid: 0xFFFF
    factor: 0.125
    unit: 'rpm'
    receivers:
      - 'CLIM'

  SPEED:
    bits: '3-4'
    alt_names: ['VITV']
    comment:
      en: 'Vehicle speed'
      fr: 'Vitesse véhicule instantanée'
    type: 'uint16'
    offset: 0
    min: 0
    max: 0xFFFE
    invalid: 0xFFFF
    factor: 0.01
    unit: 'km/h'
    receivers:
      - 'EMF'
      - 'RAD'

  DISTANCE_TRAVELLED:
    bits: '5-6'
    alt_names: ['DIST']
    comment:
      en: 'Distance traveled'
      fr: 'Distance parcourue'
    type: 'uint16'
    offset: 0
    factor: 0.1
    min: modulo 6553.5m
    unit: 'meters'
    receivers:
      - 'EMF'

  FUEL_CONSUMPTION:
    bits: '7'
    alt_names: ['CONSO']
    comment:
      en: 'Fuel consumption'
      fr: 'Consommation de carburant'
    type: 'uint8'
    offset: 0
    factor: 80
    min: modulo 20400mm3
    unit: 'mm3'
