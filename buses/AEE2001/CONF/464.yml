id: 0x464
name: 'AIR CONDITIONING REQUESTS'
alt_names: ['DEMANDES CLIMATISATION']
length: 5
comment:
  en: 'AIR CONDITIONING REQUESTS'
  fr: 'DEMANDES_CLIMATISATION'
type: 'VAN'
periodicity: '100ms + event based'
senders:
  - 'CLIM'
receivers:
  - 'BSI'

signals:
  LOAD_SHEDDING_STATUS1:
    bits: '1.7'
    alt_names: ['DEL_NV1_DEM_CLIM']
    comment:
      en: 'Level 1 load shedding possible'
      fr: 'Delestage niveau 1 possible'
    values:
      0:
        en: 'Impossible'
        fr: 'Impossible'
      1:
        en: 'Possible'
        fr: 'Possible'

  LOAD_SHEDDING_STATUS2:
    bits: '1.6'
    alt_names: ['DEL_NV2_DEM_CLIM']
    comment:
      en: 'Level 2 load shedding possible'
      fr: 'Delestage niveau 2 possible'
    values:
      0:
        en: 'Impossible'
        fr: 'Impossible'
      1:
        en: 'Possible'
        fr: 'Possible'

  LOAD_SHEDDING_STATUS3:
    bits: '1.5'
    alt_names: ['DEL_NV3_DEM_CLIM']
    comment:
      en: 'Level 3 load shedding possible'
      fr: 'Delestage niveau 3 possible'
    values:
      0:
        en: 'Impossible'
        fr: 'Impossible'
      1:
        en: 'Possible'
        fr: 'Possible'

  AC_REQUEST_STATUS:
    bits: '1.4'
    alt_names: ['REFRI_DEM_CLIM']
    comment:
      en: 'AC requested'
      fr: 'Demande de réfri (AC/ON)'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  AC_REQUEST_IS_VALID:
    bits: '1.3'
    alt_names: ['REFRIV_DEM_CLIM']
    comment:
      en: 'AC request is valid'
      fr: 'Demande de réfri validée (AC/CLIM)'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  RECYCLING_STATUS:
    bits: '1.2'
    alt_names: ['RECYCL_DEM_CLIM']
    comment:
      en: 'Recycling info'
      fr: 'Info recyclage'
    values:
      0:
        en: 'Outside air'
        fr: 'Air extérieur'
      1:
        en: 'Recycling or partial recycling '
        fr: 'Recyclage ou recyclage partiel'

  ELECTRIC_WINDSHIELD_STATUS:
    bits: '1.1'
    alt_names: ['ACT_PBE_DEM_CLIM']
    comment:
      en: 'Electric windshield activation'
      fr: 'Activation pare-brise électrique'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  HEATED_SCREEN_ACTIVATION:
    bits: '1.0'
    alt_names: ['ACT_LUN_DEM_CLIM']
    comment:
      en: 'Heated screen activation'
      fr: 'Activation lunette chauffante'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  ARTIFICIAL_LIGHT_STATUS:
    bits: '2.7'
    alt_names: ['LUM_ART_DEM_CLIM']
    comment:
      en: 'Artificial light info'
      fr: 'Info lumiere artificielle'
    values:
      0:
        en: 'Absent'
        fr: 'Absence'
      1:
        en: 'Present'
        fr: 'Présence'

  AC_ACTIVATION_REQUEST_STATUS:
    bits: '2.6'
    alt_names: ['ON_REQ_CMD_CLIM']
    comment:
      en: 'Request for activating the A/C'
      fr: 'Demande d`activation fonctionnelle de la Clim'
    values:
      0:
        en: 'Not requested'
        fr: 'Pas de demande'
      1:
        en: 'Requested'
        fr: 'Demande'

  AC_READY_STATUS:
    bits: '2.5'
    alt_names: ['READY_CMD_CLIM']
    comment:
      en: 'Climatisation Ready / Not Ready'
      fr: 'Climatisation Ready / Not Ready'
    values:
      0:
        en: 'Not ready'
        fr: 'Not ready'
      1:
        en: 'Ready'
        fr: 'Ready'

  AIR_HEATER_VALVE_REQUEST_STATUS:
    bits: '2.4'
    alt_names: ['FERM_VAN_AER_CLIM']
    comment:
      en: 'Authorization to activate the opening of the air heater valve for the air conditioning requirement'
      fr: 'Autorisation d`activation de l`ouverture de la vanne aérotherme pour le besoin climatisation'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  UNUSED_1:
    bits: '2.3'
    unused: true

  PTC_ENGAGEMENT_STATUS:
    bits: '2.2'
    alt_names: ['ENCL_CTP_DEM_CLIM']
    comment:
      en: 'PTC engagement: Integrate an additional condition to the Engine Water and Outside Air Temperature for PTC engagement'
      fr: 'Enclenchement CTP :Integrer une condition complémentaire au Temperature Eau Moteur et Air Extérieur pour l`enclenchement des CTP'
    values:
      0:
        en: 'Not authorized'
        fr: 'Non autorisé'
      1:
        en: 'Authorized'
        fr: 'Autorisé'

  WATER_PUMP_ACTIVATION_STATUS:
    bits: '2.1'
    alt_names: ['POMP_EAU_CMD_CLIM']
    comment:
      en: 'Electric water pump activation'
      fr: 'Activation pompe a eau électrique'
    values:
      0:
        en: 'Not requested'
        fr: 'Non demandé'
      1:
        en: 'Requested'
        fr: 'Demandé'

  STOP_START_STATUS:
    bits: '2.0'
    alt_names: ['STOP_GO_CMD_CLIM']
    comment:
      en: 'Engine stop authorization in Stop and Go'
      fr: 'Autorisation arrét moteur en Stop and Go'
    values:
      0:
        en: 'Stop authorization'
        fr: 'Autorisation du stop'
      1:
        en: 'Prohibition of Stop'
        fr: 'Interdiction du stop ou demande du start'

  DAY_LUMINOSITY_VALUE:
    bits: '3'
    alt_names: ['LUM_JOUR']
    comment:
      en: 'Luminosity measurement - Brightness = N * 500 lux (if sensors L and R, then average information)'
      fr: 'Mesure de luminosité du jour - Luminosité = N * 500 lux (si capteurs G et D, alors moyenne des infos)'
    type: 'uint8'
    offset: 0
    min: 0
    max: 0xDC
    invalid: 0xFF
    factor: 500
    unit: 'lux'

  NIGHT_LUMINOSITY_VALUE:
    bits: '4'
    alt_names: ['LUM_NUIT']
    comment:
      en: 'Daytime light measurement for automatic switching on - Brightness = N * 20 lux (if sensors L and R, then average information). The BSI reconstitutes the luminosity from these two values, we will therefore take care to disseminate only coherent information between them (atomicity)'
      fr: 'Mesure de luminosité de tombée de jour pour allumage automatique - Luminosité = N * 20 lux (si capteurs G et D, alors moyenne des infos). La BSI reconstitus la luminosité a partir de ces deux valeurs, on veillera donc á ne diffuser que des informations cohérentes entre elles (atomicité)'
    type: 'uint8'
    offset: 0
    min: 0
    max: 0xB9
    invalid: 0xFF
    factor: 20
    unit: 'lux'

  ELECTRIC_POWER_CONSUMED:
    bits: '5'
    alt_names: ['P_ELEC_CLIM']
    comment:
      en: 'Electric power consumed by the air conditioning'
      fr: 'Puissance électrique consommée par la clim'
    type: 'uint8'
    offset: 0
    min: 0
    max: 0xFE
    invalid: 0xFF
    factor: 25
    unit: 'W'

