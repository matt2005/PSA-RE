id: 0x664
name: 'Odometer status'
alt_names: ['ETAT_COMBINE']
length: 11
comment:
  en: 'Odometer status'
  fr: 'Etat combine'
type: 'VAN'
method: 'write (require ack)'
periodicity: '200ms + event based'
senders:
  - 'CMB'
receivers:
  - 'BSI'

signals:
  OIL_LEVEL_ALERT:
    bits: '1.7'
    alt_names: ['ALE_NIVH_ACQ_CMB']
    comment:
      en: 'Oil level alert'
      fr: 'Alerte niveau d`huile'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Alerted'
        fr: 'Alerte'

  OIL_PRESSURE_ALERT:
    bits: '1.6'
    alt_names: ['ALE_PREH_ACQ_CMB']
    comment:
      en: 'Oil pressure alert'
      fr: 'Alerte pression d`huile'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Alerted'
        fr: 'Alerte'

  WATER_LEVEL_ALERT:
    bits: '1.5'
    alt_names: ['ALE_NIVE_ACQ_CMB']
    comment:
      en: 'Water level alert'
      fr: 'Alerte niveau d`eau'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Alerted'
        fr: 'Alerte'

  FRONT_AIRBAG_FAULT:
    bits: '1.4'
    alt_names: ['DEF_ABF_ACQ_CMB']
    comment:
      en: 'Front air bag fault'
      fr: 'Défaut air-bag frontal'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Fault detected'
        fr: 'Défaut'

  VOLUME_UP:
    bits: '1.3'
    alt_names: ['DEF_ABL_ACQ_CMB']
    comment:
      en: 'Side air bag fault'
      fr: 'Défaut air-bag latéral'
    values:
      0:
        en: 'Normal'
        fr: 'Normal'
      1:
        en: 'Fault detected'
        fr: 'Défaut'

  REQUEST_ODOMETER_ACTIVATION:
    bits: '1.2'
    alt_names: ['ON_REQ_ACQ_CMB']
    comment:
      en: 'Request for functional activation of the odometer'
      fr: 'Demande d`activation fonctionnelle du combiné'
    values:
      0:
        en: 'Not requested'
        fr: 'Pas de demande'
      1:
        en: 'Requested'
        fr: 'Demande'

  WARNING_BUTTON_STATUS:
    bits: '1.1'
    alt_names: ['PUSH_ACQ_CMB']
    comment:
      en: 'Warning button status'
      fr: 'Entrée Push Warning'
    values:
      0:
        en: 'Inactive'
        fr: 'Non activé'
      1:
        en: 'Active'
        fr: 'Activé'

  REAR_WINDOW_HEATING_STATUS:
    bits: '1.0'
    alt_names: ['LUCH_ACQ_CMB']
    comment:
      en: 'Rear window heating status'
      fr: 'Entrée Luch activée / non activée'
