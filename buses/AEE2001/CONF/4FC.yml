id: 0x4FC
name: 'ODOMETER COMMANDS'
alt_names: ['COMMANDE_COMBINE']
length: 14
comment:
  en: 'Odometer commands'
  fr: 'COMMANDE_COMBINE'
type: 'VAN'
method: 'write (require ack)'
periodicity: '200 ms + event based'
senders:
  - 'BSI'
receivers:
  - 'CMB'

signals:
  ODOMETER_STATUS:
    bits: '1.7'
    alt_names: ['ON_CMB']
    comment:
      en: 'Odometer on/off'
      fr: 'Marche/arrét du combine'
    values:
      0:
        en: 'Odometer off'
        fr: 'Combiné non actif'
      1:
        en: 'Odometer on'
        fr: 'Combiné actif'

  SPEED_REGULATION_STATUS:
    bits: '1.6'
    alt_names: ['R_VIT_CMB']
    comment:
      en: 'Speed regulation wheel status'
      fr: 'Information pour le combine: regulation de Vitesse'
    values:
      0:
        en: 'Inactive'
        fr: 'Régulation de Vitesse non active'
      1:
        en: 'Active'
        fr: 'Régulation de Vitesse active'

  WARNING_PUSH_CMB:
    bits: '1.5'
    alt_names: ['WARNING_PUSH_CMB']
    comment:
      en: 'Emergency lights turned on'
      fr: 'Information pour le combine: témoin de fonctionnement de push warning'
    values:
      0:
        en: 'Warning not active'
        fr: 'Warning non activé'
      1:
        en: 'Warning active'
        fr: 'Warning activé'

  REAR_WINDOW_HEATING_STATUS:
    bits: '1.4'
    alt_names: ['LUCH_CMB']
    comment:
      en: 'Rear window heating status'
      fr: 'Information pour le combine: temoin de fonctionnement Luch'
    values:
      0:
        en: 'Inactive'
        fr: 'Luch non activéé'
      1:
        en: 'Active'
        fr: 'Luch activéé'

  AC_AIR_RECYCLING_STATUS:
    bits: '1.3'
    alt_names: ['RECYCL_CMB']
    comment:
      en: 'AC air recycling status'
      fr: 'Message pour le combine: recyclage climatisation'
    values:
      0:
        en: 'Air recycling inactive'
        fr: 'Recyclage non actif'
      1:
        en: 'Air recycling active'
        fr: 'Recyclage actif'

  PRE_HEATING_STATUS:
    bits: '1.2'
    alt_names: ['PRE_CHAUFF_CMB']
    comment:
      en: 'Pre-heating sparks status'
      fr: 'Message pour le combiné : pré-chauffage'
    values:
      0:
        en: 'Pre-heating inactive'
        fr: 'Pré-chauffage inactif'
      1:
        en: 'Pre-heating active'
        fr: 'Pré-chauffage actif'

  ASR_ABS_STATUS:
    bits: '1.1'
    alt_names: ['ASR_CDS_CMB']
    comment:
      en: 'ASR/ABS activated'
      fr: 'Message pour le combine: ASR/CDS en regulation'
    values:
      0:
        en: 'Inactive'
        fr: 'Régulation non active'
      1:
        en: 'Active'
        fr: 'Régulation active'

  MEMORIZATION_STATUS:
    bits: '1.0'
    alt_names: ['MEMO_CMB']
    comment:
      en: 'Memorization active'
      fr: 'Message pour le combine: mémorisation effectuée'
    values:
      0:
        en: 'Inactive'
        fr: 'Mémorisation non effectuée'
      1:
        en: 'Active'
        fr: 'Mémorisation effectuée'

  DEFAULT_LAMP_STATUS:
    bits: '2.7'
    alt_names: ['LAMP_CMB']
    comment:
      en: 'Default lamps'
      fr: 'Message pour le combine: défaut lamps'
    values:
      0:
        en: 'Not default'
        fr: 'Pas de défaut lamps'
      1:
        en: 'Default'
        fr: 'Défaut lampe'

  SUSPENSION_STATUS:
    bits: '2.6'
    alt_names: ['SUSP_LAMP_CMB']
    comment:
      en: 'Suspension status'
      fr: 'Information pour le combine: Push Hydractive / Suspension pilotés'
    values:
      0:
        en: 'Sport suspension inactive'
        fr: 'Suspension sport non actives'
      1:
        en: 'Sport suspension active'
        fr: 'Suspension sport actives'

  ALARM_STATUS:
    bits: '2.5'
    alt_names: ['ALARME_PUSH_CMB']
    comment:
      en: 'Alarm status'
      fr: 'Information pour le combine: Push alarms'
    values:
      0:
        en: 'Inactive'
        fr: 'Alarme non actives'
      1:
        en: 'Active'
        fr: 'Alarme actives'

  DIGITAL_OUT1_STATUS:
    bits: '2.4'
    alt_names: ['MECA1_CMB']
    comment:
      en: 'Mechatronic digital output no.1'
      fr: 'Information pour le combine: sortie TOR mécatronique no 1'
    values:
      0:
        en: 'Not driven'
        fr: 'Non commandes'
      1:
        en: 'Driven'
        fr: 'Commandée'

  DIGITAL_OUT2_STATUS:
    bits: '2.3'
    alt_names: ['MECA2_CMB']
    comment:
      en: 'Mechatronic digital output no.2'
      fr: 'Information pour le combine: sortie TOR mécatronique no 2'
    values:
      0:
        en: 'Not driven'
        fr: 'Non commandes'
      1:
        en: 'Driven'
        fr: 'Commandée'

  DIGITAL_OUT3_STATUS:
    bits: '2.2'
    alt_names: ['MECA3_CMB']
    comment:
      en: 'Mechatronic digital output no.3'
      fr: 'Information pour le combine: sortie TOR mécatronique no 3'
    values:
      0:
        en: 'Not driven'
        fr: 'Non commandes'
      1:
        en: 'Driven'
        fr: 'Commandée'

  DIGITAL_OUT4_STATUS:
    bits: '2.1'
    alt_names: ['MECA4_CMB']
    comment:
      en: 'Mechatronic digital output no.4'
      fr: 'Information pour le combine: sortie TOR mécatronique no 4'
    values:
      0:
        en: 'Not driven'
        fr: 'Non commandes'
      1:
        en: 'Driven'
        fr: 'Commandée'

  DOOR_STATUS:
