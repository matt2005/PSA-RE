id: 0x744
alt_id: 0x944
name: 'Vehicle position'
alt_names: ['DONNEES POSITION RT3']
length: 12
comment:
  en: 'Données de déplacement du véhicule'
  fr: 'Données de déplacement du véhicule'
type: 'VAN'
method: 'write (require ack)'
periodicity: '50ms'
senders:
  - 'BSI'
receivers:
  - 'RT3'

signals:
  REAR_RIGHT_WHEEL_SPEED:
    bits: '1-2'
    alt_names: ['VITARD_POSITION_RT3']
    comment:
      en: 'Rear right wheel speed'
      fr: 'Vitesse roue arrière droite'
    type: 'uint16_t'
    offset: 0
    min: 0
    max: 655.34
    invalid: 0xFFFF
    factor: 0.01
    unit: 'km/h'

  REAR_LEFT_WHEEL_SPEED:
    bits: '3-4'
    alt_names: ['VITARG_POSITION_RT3']
    comment:
      en: 'Rear left wheel speed'
      fr: 'Vitesse roue arrière gauche'
    type: 'uint16_t'
    offset: 0
    min: 0
    max: 655.34
    invalid: 0xFFFF
    factor: 0.01
    unit: 'km/h'

  REAR_RIGHT_ABS_ERROR_STATUS:
    bits: '5.7'
    alt_names: ['ERREUR_COMP_TD']
    comment:
      en: 'ABS rear right wheel error status'
      fr: 'Bit d`erreur pour le capteur de tops ABS roue arrière droite.'
    values:
      0:
        en: 'No error'
        fr: 'Pas d`erreur'
      1:
        en: 'Error'
        fr: 'Erreur'

  REAR_RIGHT_WHEEL_COUNTER:
    bits: '5.6-6.0'
    alt_names: ['COMPTD_POSITION_RT3']
    comment:
      en: 'Rear right wheel counter'
      fr: 'Compteur roue arrière droite'
    description:
      en: 'Rear right wheel top counter. Free-running counter (factor = 1) No reset as long as the + APC is present (excluding overflow).'
      fr: 'Compteur de top de la roue arrière droite. Compteur en "Free-running"(facteur=1). Pas de remise à zéro tant que le + APC est présent (hors overflow).'
    type: 'uint16_t'
    offset: 0
    min: 0
    max: 32767
    invalid:
    factor: 1
    unit: 'km/h'

  REAR_LEFT_ABS_ERROR_STATUS:
    bits: '7.7'
    alt_names: ['ERREUR_COMP_TG']
    comment:
      en: 'ABS rear left wheel error status'
      fr: 'Bit d`erreur pour le capteur de tops ABS roue arrière gauche.'
    values:
      0:
        en: 'No error'
        fr: 'Pas d`erreur'
      1:
        en: 'Error'
        fr: 'Erreur'

  REAR_LEFT_WHEEL_COUNTER:
    bits: '7.6-8.0'
    alt_names: ['COMPTG_POSITION_RT3']
    comment:
      en: 'Rear left wheel counter'
      fr: 'Compteur roue arrière gauche'
    description:
      en: 'Rear left wheel top counter. Free-running counter (factor = 1) No reset as long as the + APC is present (excluding overflow).'
      fr: 'Compteur de top de la roue arrière droite. Compteur en "Free-running"(facteur=1). Pas de remise à zéro tant que le + APC est présent (hors overflow).'
    type: 'uint16_t'
    offset: 0
    min: 0
    max: 32767
    invalid:
    factor: 1
    unit: 'km/h'

  ANGLE_POSITION:
    bits: '9-10'
    alt_names: ['ANGLE_POSITION_RT3']
    comment:
      en: 'Steering wheel angle'
      fr: 'Angle du volant'
    description:
      en: 'Rear left wheel top counter. Free-running counter (factor = 1) No reset as long as the + APC is present (excluding overflow).'
      fr: 'Compteur de top de la roue arrière droite. Compteur en "Free-running"(facteur=1). Pas de remise à zéro tant que le + APC est présent (hors overflow).'
    type: 'SNM16'
    offset: 0
    min: -780
    max: 780
    invalid: 0x7FFF
    factor: 0.1
    unit: 'Degré/s'

  STEERING_WHEEL_SPEED:
    bits: '11'
    alt_names: ['VITROTA_POSITION_RT3']
    comment:
      en: 'Steering wheel rotation speed'
      fr: 'Angle du volant'
    description:
      en: 'Rear left wheel top counter. Free-running counter (factor = 1) No reset as long as the + APC is present (excluding overflow).'
      fr: 'Compteur de top de la roue arrière droite. Compteur en "Free-running"(facteur=1). Pas de remise à zéro tant que le + APC est présent (hors overflow).'
    type: 'uint8_t'
    offset: 0
    min: 0
    max: 1016
    invalid: 0xFF
    factor: 4
    unit: 'Degré/s'

  STEERING_WHEEL_ROTATION_DIRECTION:
    bits: '12.7'
    alt_names: ['SENS_ANG_VOL']
    comment:
      en: 'Steering wheel rotation direction'
      fr: 'Sens de rotation du volant'
    values:
      0:
        en: 'Clockwise'
        fr: 'Sens horaire'
      1:
        en: 'Anti-Clockwise'
        fr: 'Sens trigo'

  STEERING_WHEEL_ANGLE_SENSOR_FAULT_CODE:
    bits: '12.6-12.3'
    alt_names: ['DEF_CAPT_VOL']
    comment:
      en: 'Steering wheel angle sensor fault code'
      fr: 'Code défaut capteur angle volant'
    values:
      0:
        en: 'No fault'
        fr: 'Pas défaut'

  STEERING_WHEEL_ANGLE_SENSOR_ADJUSTED:
    bits: '12.2'
    alt_names: ['CAPT_ANG_VOL_AJU']
    comment:
      en: 'Steering wheel angle sensor adjusted'
      fr: 'Capteur angle volant ajusté'
    values:
      0:
        en: 'Not adjusted'
        fr: 'Capteur non ajusté'
      1:
        en: 'Adjusted'
        fr: 'Capteur ajusté'

  STEERING_WHEEL_ANGLE_SENSOR_CALIBRATED:
    bits: '12.1'
    alt_names: ['CAPT_ANG_VOL_CAL']
    comment:
      en: 'Steering wheel angle sensor calibrated'
      fr: 'Capteur angle volant calibré'
    values:
      0:
        en: 'Not calibrated'
        fr: 'Capteur non calibré'
      1:
        en: 'Calibrated'
        fr: 'Capteur calibré'

  STEERING_WHEEL_ANGLE_SENSOR_INTERNAL_STATUS:
    bits: '12.0'
    alt_names: ['STAT_ANG_VOL']
    comment:
      en: 'Steering wheel angle internal status'
      fr: 'Status interne angle volant'
    values:
      0:
        en: 'Faulty sensor'
        fr: 'Capteur en défaut'
      1:
        en: 'Sensor ok'
        fr: 'Capteur OK'