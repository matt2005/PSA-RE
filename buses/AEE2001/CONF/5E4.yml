id: 0x5E4
name: 'EMF BSI requests'
alt_names: ['DEMANDES_EMF_BSI']
length: 2
comment:
  en: 'EMF BSI requests'
  fr: 'DEMANDES EMF BSI'
type: 'VAN'
periodicity: '500ms + event based'
method: 'write (require ack)'
senders:
  - 'EMF'
receivers:
  - 'BSI'

signals:
  RESET_TRIP_COMPUTER_TOTAL:
    bits: '1.7'
    alt_names: ['RAZ_CUMP_DDES_EMF']
    comment:
      en: 'Requests to reset course totals'
      fr: 'Demands de RAZ des cumuls parcours'
    values:
      0:
        en: 'Not requested'
        fr: 'Pas de demande'
      1:
        en: 'Requested'
        fr: 'Demande'

  RESET_TRIP_COMPUTER_CUMULATIVE:
    bits: '1.6'
    alt_names: ['RAZ_CUMT_DDES_EMF']
    comment:
      en: 'Trip cumulative reset request'
      fr: 'Demande de RAZ des cumuls trajet'
    values:
      0:
        en: 'Not requested'
        fr: 'Pas de demande'
      1:
        en: 'Requested'
        fr: 'Demande'

  KEEP_ALIVE_OF_VAN_COMFORT:
    bits: '1.5'
    alt_names: ['MINT_VAN_DDES_EMF']
    comment:
      en: 'Request for keep alive of + VAN comfort'
      fr: 'Demande de maintient du + VAN confort'
    values:
      0:
        en: 'Not requested'
        fr: 'Pas de demande'
      1:
        en: 'Requested'
        fr: 'Demande'

  OVERSPEED_ALERT:
    bits: '1.4'
    alt_names: ['ALE_SURV_DDES_EMF']
    comment:
      en: 'Active overspeed alerts'
      fr: 'Alerts survitesse active'
    values:
      0:
        en: 'Function not requested'
        fr: 'Fonction non demandés'
      1:
        en: 'Function requested'
        fr: 'Fonction demandée'

  OVERSPEED_MEMORIZATION_REQUEST:
    bits: '1.3'
    alt_names: ['MEMO_SURV_DDES_EMF']
    comment:
      en: 'Overspeed memorization requested'
      fr: 'Mémorisation survitesse demandée'
    values:
      0:
        en: 'Memorization not requested'
        fr: 'Mémorisation non demandés'
      1:
        en: 'Memorization requested'
        fr: 'Mémorisation demandée'

  ALERT_REMINDER_REQUEST:
    bits: '1.2'
    alt_names: ['RAPL_ALERT_DDES_EMF']
    comment:
      en: 'Alert reminder request'
      fr: 'Demande de rappel des alertes'
    values:
      0:
        en: 'Reminder not requested'
        fr: 'Rappel non demandés'
      1:
        en: 'Reminder requested'
        fr: 'Rappel demandée'

  UNUSED_1:
    bits: '1.1-1.0'
    unused: true
    alt_names: ['Libre2']

  OVERSPEED_ALERT_VALUE:
    bits: '2'
    alt_names: ['SEUIL_SURVIT']
    comment:
      en: 'Overspeed alert threshold entered by the customer'
      fr: 'Seuil d`alerte Survitesse saisi par le client'
    type: 'uint'
    offset: 0
    min: 0
    max: 254
    invalid: 0xFF
    unit: 'km/h'
