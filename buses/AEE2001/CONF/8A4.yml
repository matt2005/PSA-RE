id: 0x8A4
name: 'BSI_SLOW_DATA'
alt_names: ['DONNEES_BSI_LENTES']
length: 7
comment:
  en: 'Contains misc informations, sent periodically with long pauses'
  fr: 'Donnes diverses, envoyees periodiquement et sur un cycle long'
type: 'VAN'
periodicity: '500ms + event based'
method: 'broadcast'
senders:
  - 'BSI'
receivers:
  - 'AAS'
  - 'CDC'
  - 'CLIM'
  - 'CMB'
  - 'EMF'
  - 'RT3'
  - 'RAD'

signals:
  DAY_NIGHT_STATUS:
    bits: '1.7'
    alt_names: ['LUM_JOUR_NUIT']
    comment:
      en: 'Day/night status'
      fr: 'Etat Jour/Nuit'
    values:
      0:
        en: 'Night (lights on)'
        fr: ''
      1:
        en: 'Day (lights off)'
        fr: ''
    receivers:
      - 'CLIM'
      - 'CMB'
      - 'EMF'
      - 'RT3'
      - 'RAD'

  DARK_MODE:
    bits: '1.6'
    alt_names: ['LUM_BLACK_PANEL']
    comment:
      en: 'Brightness Mode "Black Panel"'
      fr: 'Luminosité Mode "Black Panel"'
    values:
      0:
        en: 'Inactive'
        fr: 'Inactif'
      1:
        en: 'Active'
        fr: 'Actif'
    receivers:
      - 'CLIM'
      - 'CMB'
      - 'EMF'
      - 'RT3'
      - 'RAD'

  UNUSED_1:
    bits: '1.5'
    unused: true
    alt_names: ['RESERVE_78K0VAN']
    comment:
      en: 'Bit to toggle repeatedly to workaround the CRC bug on NEC 78 (KO run 1 and 2) component'
      fr: 'Bit á faire bagoter pour contourner le bug du CRC virtuel pour composant NEC 78 K0 Run 1 et 2'

  FRONT_WIPERS_STATUS:
    bits: '1.4'
    alt_names: ['ESSUYAGE_AV_ACTIF']
    comment:
      en: 'Front wiping status'
      fr: 'Confirmation essuyage avant'
    values:
      0:
        en: 'Not wiping'
        fr: 'Essuyage non confirme'
      1:
        en: 'Wiping'
        fr: 'Essuyage confirme'
    receivers:
      - 'CLIM'

  DASHBOARD_LIGHTING:
    bits: '1.3-1.0'
    alt_names: ['LUM_NIVEAU_COMBINE']
    comment:
        en: 'Dashboard lighting value'
        fr: 'Niveau de Luminosité du combiné'
    type: 'uint'
    min: 0
    max: 15
    receivers:
      - 'CLIM'
      - 'CMB'
      - 'EMF'
      - 'RT3'

  ALARM_STATUS:
    bits: '2.7'
    alt_names: ['ALARME']
    comment:
        en: 'Alarm active'
        fr: 'Activation de l`alarme'
    values:
      0: 
        en: 'Inactive'
        fr: 'Alarme non activée'
      1:
        en: 'Active'
        fr: 'Alarme activée'

  TRAILER_STATUS:
    bits: '2.6'
    alt_names: ['ALIM_MODE_USINE']
    comment:
      en: 'Factory mode/User mode - Need to check because I remember as Trailer status (based on AAS diagnostic)'
      fr: 'Alimentation Mode Usine/Client'
    values:
      0:
        en: 'Client mode / Trailer not present'
        fr: 'Mode Client'
      1:
        en: 'Factory mode / Trailer present'
        fr: 'Mode Usine'
    receivers:
      - 'CDC'
      - 'EMF'
      - 'RT3'
      - 'RAD'

  REVERSE_STATUS:
    bits: '2.5'
    alt_names: ['ALIM_MARCHE_ARRIERE']
    comment:
      en: 'Reverse gear status'
      fr: 'Etat de la marche arriere'
    values:
      0:
        en: 'Not in reverse gear'
        fr: 'Marche arriere non enclenchee'
      1:
        en: 'In reverse gear'
        fr: 'Marche arriere enclenchee'
    receivers:
      - 'AAS'

  ECO_MODE:
    bits: '2.4'
    alt_names: ['ALIM_MODE_ECO']
    comment:
      en: 'Economy mode status'
      fr: 'Alimentation Mode Economie'
    values:
      0:
        en: 'Economy mode inactive'
        fr: 'Mode Economie inactif'
      1:
        en: 'Economy mode active'
        fr: 'Mode Economie actif'
    receivers:
      - 'AAS'
      - 'CDC'
      - 'CLIM'
      - 'CMB'
      - 'EMF'
      - 'RT3'
      - 'RAD'

  STANDBY_MODE:
    bits: '2.3'
    alt_names: ['ALIM_MISE_EN_VEILLE']
    comment:
      en: 'Standby within 5 seconds'
      fr: 'Mise en veille sous 5 secondes'
    values:
      0:
        en: 'No standby'
        fr: 'Pas de mise en veille'
      1:
        en: 'Standby within 5 seconds'
        fr: 'Mise en veille sous 5 secondes'
    receivers:
      - 'CMB'

  ENGINE_STATUS:
    bits: '2.2'
    alt_names: ['ALIM_MOT_TOURNANT']
    comment:
      en: 'Engine running'
      fr: 'Moteur tournant'
    values:
      0:
        en: 'Engine not running'
        fr: 'Générateur non opérationnel'
      1:
        en: 'Engine running'
        fr: 'Générateur opérationnel'
    receivers:
      - 'AAS'
      - 'CLIM'
      - 'CMB'
      - 'EMF'
      - 'RT3'
      - 'RAD'

  KEY_POSITION:
    #compare with POWERTRAIN_STATUS and MAIN_STATUS in 0F6 from can
    bits: '2.1-2.0'
    alt_names: ['ALIM_POS_CLE']
    comment:
      en: 'Ignition key position'
      fr: 'Position de la clé de contact'
    values:
      0x00:
        en: 'Stop'
        fr: 'Arret'
      0x01:
        en: 'Accesories'
        fr: 'Accesoires'
      0x10:
        en: 'Starter'
        fr: 'Démarreur'
      0x11:
        en: 'Contact'
        fr: 'Contact'
    receivers:
      - 'AAS'
      - 'CLIM'
      - 'CMB'
      - 'EMF'
      - 'RT3'
      - 'RAD'

  COOLANT_TEMPERATURE:
    bits: '3'
    alt_names: ['T_EAU']
    comment:
      en: 'Coolant temperature'
      fr: 'Temperature eau'
    type: 'uint'
    offset: -40
    min: -40
    max: 214
    invalid: 0xFF
    unit: 'celsius'
    receivers:
      - 'CLIM'
      - 'CMB'

  TOTAL_MILEAGE:
    bits: '4-6'
    alt_names: ['KM_TOTAL']
    comment:
      en: 'Odometer mileage in meters (0x27C87D = 260722.9 meters)'
      fr: 'Totalisateur kilométrage véhicule'
    type: 'uint'
    offset: 0
    min: 0
    max: 1677721.4
    factor: 0.1
    invalid: 0xFFFFFF
    unit: 'km'
    receivers:
      - 'CMB'

  EXTERNAL_TEMPERATURE:
    bits: '7'
    alt_names: ['T_EXT']
    comment:
      en: 'External temperature'
      fr: 'Temperature exterieure'
    type: 'float'
    offset: -40
    factor: 0.5
    min: -40
    max: 87.5
    invalid: 0xFF
    units: 'celsius'
    receivers:
      - 'CLIM'
      - 'EMF'
      - 'RT3'