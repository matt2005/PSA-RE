id: 0x8C4
name: 'Radio keyboard events'
alt_names: ['EVENEMENT_RADIO_CLAV']
length: 3
comment:
  en: 'EMF RAD requests'
  fr: 'DEMANDES EMF RAD'
observations: 
  en: 'The radio sends this frame to the EMF which on reception will transmit a read message according to the event type. For example when a radio button pressed the EMF sends a 0x4D4 to read the status of the radio'
  fr: ''
type: 'VAN'
method: 'write (require ack)'
periodicity: 'event based'
senders:
  - 'RAD'
receivers:
  - 'EMF'

signals:
  MAIN_EVENT_STATUS:
    bits: '1.7'
    alt_names: ['PRN_EVENT']
    comment:
      en: 'Main event (generic)'
      fr: 'Evénement principal (Générique)'
    values:
      0:
        en: 'Not present'
        fr: 'Non Présent'
      1:
        en: 'Present'
        fr: 'Présent'

  NO_ACTION:
    bits: '1.6'
    alt_names: ['NO_ACTION']
    comment:
      en: 'Function not supported '
      fr: 'Fonction non supportée'
    values:
      0:
        en: '??'
        fr: '??'
      1:
        en: 'When function not implemented or is temporarily unavailable'
        fr: '??'

  UNUSED_1:
    bits: '1.5'
    alt_names: ['Libre1']
    unused: true

  EVENT_SOURCE:
    bits: '1.4-1.0'
    alt_names: ['SRC_EVENT']
    comment:
      en: 'Source of event (generic)'
      fr: 'Source des événements (générique)'
    values:
      0x0E:
        en: 'Climatisation'
        fr: 'Climatisation'
      0x12:
        en: 'BSI'
        fr: 'BSI'
      0x0A:
        en: 'Radio'
        fr: 'Auto Radio'
      0x07:
        en: 'Navigation'
        fr: 'Navigation'
      0x1A:
        en: 'Phone'
        fr: 'Radio téléphone'
      0x16:
        en: 'CD changer'
        fr: 'Lecteur multidisques compacts'
      0x14:
        en: 'Parking assistance'
        fr: 'Aide Au Stationnement'

  DATA_ID:
    bits: '2.7-2.5'
    alt_names: ['EVE_BUFPART_RAD']
    comment:
      en: 'Identification of the data contained in the <PART> buffer'
      fr: 'Identification des données contenues dans le buffer <PART>'
    values:
      000:
        en: 'Not changing'
        fr: 'Pas de changement'
      001:
        en: 'TUNER'
        fr: 'TUNER'
      010:
        en: 'TUNER_REPERTOIRE'
        fr: 'TUNER_REPERTOIRE'
      011:
        en: 'TAPE'
        fr: 'CASSETTE'
      100:
        en: 'Reserved'
        fr: 'Réservé'
      101:
        en: 'Reserved'
        fr: 'Réservé'
      110:
        en: 'CD status'
        fr: 'ETAT_CD'
      111:
        en: 'Reserved: TMC status'
        fr: 'Réservé ETAT_TMC'

  CD_EVENT:
    bits: '2.4'
    alt_names: ['EVE_CD_RAD']
    comment:
      en: 'CD event (radio)'
      fr: 'Evénement CD (radio)'
    values:
      0:
        en: 'No event'
        fr: 'Pas d`événement'
      1:
        en: 'Event'
        fr: 'Evénement'

  TAPE_EVENT:
    bits: '2.3'
    alt_names: ['EVE_K7_RAD']
    comment:
      en: 'Tape event (radio)'
      fr: 'Evénement Cassette (radio)'
    values:
      0:
        en: 'No event'
        fr: 'Pas d`événement'
      1:
        en: 'Event'
        fr: 'Evénement'

  TUNER_EVENT:
    bits: '2.2'
    alt_names: ['EVE_TUN_RAD']
    comment:
      en: 'Tuner event (radio)'
      fr: 'Evénement Tuner (radio)'
    values:
      0:
        en: 'No event'
        fr: 'Pas d`événement'
      1:
        en: 'Event'
        fr: 'Evénement'

  BUTTON_EVENT:
    bits: '2.1'
    alt_names: ['EVE_CLAV_RAD']
    comment:
      en: 'Button event (radio)'
      fr: 'Evénement Clavier radio'
    values:
      0:
        en: 'No event'
        fr: 'Pas d`événement'
      1:
        en: 'Event'
        fr: 'Evénement'

  GENERAL_EVENT:
    bits: '2.0'
    alt_names: ['EVE_GEN_RAD']
    comment:
      en: 'General event (radio)'
      fr: 'Evénement Général radio'
    values:
      0:
        en: 'No event'
        fr: 'Pas d`événement'
      1:
        en: 'Event'
        fr: 'Evénement'

  BUTTON_STATUS:
    bits: '3.7-3.6'
    alt_names: ['EVE_EXT_CLAV_RAD']
    comment:
      en: 'User event on radio keypad'
      fr: 'Evénement utilisateur sur clavier radio'
    values:
      00:
        en: 'Push'
        fr: 'Pression'
      01:
        en: 'Release'
        fr: 'Relachement'
      10:
        en: 'Long press'
        fr: 'Pression longue'
      11:
        en: 'Repeated'
        fr: 'Répétition'

  BUTTON_ID:
    bits: '3.5-3.0'
    alt_names: ['KEY_EXT_CLAV_RAD']
